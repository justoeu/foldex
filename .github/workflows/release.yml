name: release

# Publishes Docker images to Docker Hub only after a manual dispatch from main.
# Input `vX.Y.Z` publishes semver + SHA + latest tags; a full 40-character SHA
# publishes SHA and adds latest only at the current main tip. Pushing a branch
# or tag never starts this workflow.
#
# Does NOT re-run lint/tests. The PR gate in ci.yml already validated the
# code before it reached main. A Docker-credential-free gate below rejects a
# workflow loaded from any ref other than main, loose targets, and any SHA
# outside origin/main before a publishing job can start.
#
# Build topology: 2 images × 2 architectures = 4 runners in parallel.
# Each cell builds a **single-arch** image on a **native** runner
# (ubuntu-latest for amd64, ubuntu-24.04-arm for arm64) — no QEMU
# emulation. Per-arch images are pushed *by digest only* (no tags yet).
# The `publish-manifest` job then assembles the per-arch digests into a
# single multi-arch tag list using `docker buildx imagetools`.
#
# Why this beats a single-job layout:
#   - arm64 ran emulated under QEMU on an amd64 runner — `bun install`,
#     `bun run build`, and `apk upgrade` ran 5-10× slower. Native arm64
#     runners bring it to wall-clock parity with amd64.
#   - backend + web used to build sequentially in the same job. Now both
#     start at the same minute on independent runners.
# Reference: https://docs.docker.com/build/ci/github-actions/multi-platform/
#
# Requires secrets on the protected `release` GitHub environment. Delete any
# repository-level copies: historical workflows do not declare this environment
# and therefore cannot read environment-only credentials when an old tag is pushed.
#   DOCKERHUB_USERNAME — Docker Hub login
#   DOCKERHUB_TOKEN    — Docker Hub Personal Access Token (NOT the password)
on:
  workflow_dispatch:
    inputs:
      target:
        description: Strict vMAJOR.MINOR.PATCH tag or full 40-character commit SHA
        required: true
        type: string

# Least-privilege default for every job.
permissions:
  contents: read

# Serialized PER TARGET, not globally.
#
# A single group for the whole workflow serialized the right thing for the wrong
# span. The publish jobs sit on the `release` environment waiting for a human,
# and a run nobody approves holds the group for as long as it waits — with
# `cancel-in-progress: false`, every later dispatch queues behind it. That is
# not hypothetical: one unapproved run from 2026-08-26 blocked the queue for two
# days and seven subsequent releases were cancelled without publishing, with
# nothing in the UI naming the cause. The symptom is a run stuck in `pending`
# with zero jobs, which reads like a runner shortage.
#
# Keyed by target, an unapproved release only blocks another dispatch of THE
# SAME version, which is exactly what it should block.
#
# What the global group was protecting — two approved dispatches racing to
# overwrite `:latest` via `imagetools create` — is preserved one level down
# on `publish-manifest`, keyed by image so the three cells of one run do
# not share a group (GitHub would cancel pending siblings). Builds and
# approval waits overlap freely; two runs of the same image do not.
concurrency:
  group: ${{ github.workflow }}-${{ inputs.target }}
  cancel-in-progress: false

jobs:
  validate-release-ref:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      create_tag: ${{ steps.validate.outputs.create_tag }}
      is_semver: ${{ steps.validate.outputs.is_semver }}
      publish_latest: ${{ steps.validate.outputs.publish_latest }}
      release_tag: ${{ steps.validate.outputs.release_tag }}
      short_sha: ${{ steps.validate.outputs.short_sha }}
      target_sha: ${{ steps.validate.outputs.target_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Prove release target
        id: validate
        env:
          RELEASE_TARGET: ${{ inputs.target }}
        run: bash scripts/validate-release-ref.sh "$RELEASE_TARGET" "$GITHUB_REF" "$GITHUB_SHA"

  create-release-tag:
    needs: [validate-release-ref, publish-manifest]
    if: needs.validate-release-ref.outputs.create_tag == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create validated release tag
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.validate-release-ref.outputs.release_tag }}
          TARGET_SHA: ${{ needs.validate-release-ref.outputs.target_sha }}
        run: |
          tag_object_sha=$(gh api --method POST "repos/$GITHUB_REPOSITORY/git/tags" \
            -f tag="$RELEASE_TAG" \
            -f message="Foldex release workflow run $GITHUB_RUN_ID" \
            -f object="$TARGET_SHA" \
            -f type=commit \
            -f 'tagger[name]=github-actions[bot]' \
            -f 'tagger[email]=41898282+github-actions[bot]@users.noreply.github.com' \
            --jq .sha)
          gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
            -f ref="refs/tags/$RELEASE_TAG" \
            -f sha="$tag_object_sha"

  publish:
    needs: validate-release-ref
    environment: release
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        image:
          - name: backend
            context: ./backend
            repo: justoeu/foldex-backend
          # The backup agent (ADR-43) is a TARGET of the backend Dockerfile
          # published as a suffixed tag of the SAME repository — a third Docker
          # Hub repo is worse than a second tag (see the Dockerfile's mailer
          # note, which set the precedent).
          - name: backup-agent
            context: ./backend
            repo: justoeu/foldex-backend
            target: backup-agent
          - name: web
            # web/Dockerfile no longer COPYs certs into the image — the
            # entrypoint generates an ephemeral self-signed pair at
            # container start (or the operator mounts their own pair as a
            # volume). Keeps private keys OUT of the published image.
            context: ./web
            repo: justoeu/foldex-web
        platform:
          - tag: amd64
            id: linux/amd64
            runner: ubuntu-latest
          - tag: arm64
            id: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.platform.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate-release-ref.outputs.target_sha }}
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & push by digest
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ${{ matrix.image.context }}
          file: ${{ matrix.image.context }}/Dockerfile
          # Empty for the default final stage; the backup-agent cell builds
          # its named stage of the same Dockerfile.
          target: ${{ matrix.image.target || '' }}
          platforms: ${{ matrix.platform.id }}
          # push-by-digest=true: upload the image to the registry without
          # any tag. The manifest job below stitches the per-arch digests
          # into the canonical tags so a half-finished build can never
          # half-overwrite `latest`.
          outputs: |
            type=image,name=${{ matrix.image.repo }},push-by-digest=true,name-canonical=true,push=true
          # Supply-chain attestations: SLSA provenance + SBOM are attached
          # to each per-arch image as OCI referrers. Docker Scout/Snyk
          # surface these as "supply chain attestation present" and they
          # back the in-platform CVE traceability. They reference the
          # digest, so the manifest job's tag-assembly below doesn't
          # detach them (buildx imagetools re-anchors the referrer
          # descriptors to the new manifest-list digest).
          #
          # Posture note: these are SELF-ATTESTED (unsigned). The job's
          # `permissions: contents: read` deliberately omits
          # `id-token: write`, so buildx cannot do Sigstore keyless
          # signing. Anyone with push creds could mint equivalent
          # provenance — sufficient to close the "missing attestation"
          # scanner finding, NOT a cryptographic trust chain. Promote to
          # cosign keyless + Rekor transparency if real verifiability is
          # ever required.
          provenance: true
          sbom: true
          # Scope cache by image AND arch — sharing across archs poisons
          # the cache (an amd64 layer can't satisfy an arm64 build).
          cache-from: type=gha,scope=foldex-${{ matrix.image.name }}-${{ matrix.platform.tag }}
          cache-to: type=gha,scope=foldex-${{ matrix.image.name }}-${{ matrix.platform.tag }},mode=max

      - name: Export digest
        # Drop a sentinel file named after the digest; the manifest job
        # downloads every per-image-per-arch artifact and reads the
        # filenames to assemble the final manifest list. Prefixing the
        # architecture lets the manifest job require one digest per matrix arm.
        run: |
          mkdir -p /tmp/digests
          digest='${{ steps.build.outputs.digest }}'
          touch "/tmp/digests/${{ matrix.platform.tag }}-${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: digests-${{ matrix.image.name }}-${{ matrix.platform.tag }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  # Assemble the per-arch digests of each image into a single multi-arch
  # manifest under the canonical tags. Runs in parallel for backend + web
  # via a matrix; each cell waits on its two `publish` matrix cells.
  publish-manifest:
    needs: [validate-release-ref, publish]
    environment: release
    runs-on: ubuntu-latest
    # A group without the matrix key is shared by backend, web and
    # backup-agent; GitHub then cancels previously pending siblings when
    # the next cell queues. Same-run cells write different repos/tags and
    # must overlap; two runs of the same image must not.
    concurrency:
      group: ${{ github.workflow }}-manifest-${{ matrix.image.name }}
      cancel-in-progress: false
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        image:
          - name: backend
            repo: justoeu/foldex-backend
          - name: backup-agent
            repo: justoeu/foldex-backend
            suffix: -backup-agent
          - name: web
            repo: justoeu/foldex-web
    steps:
      - name: Download digests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          # Picks up both `digests-<image>-amd64` and `digests-<image>-arm64`.
          pattern: digests-${{ matrix.image.name }}-*
          merge-multiple: true
          path: /tmp/digests

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Tag computation uses only outputs from the validated target. The
      # workflow event itself always points at main and is not release data.
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ matrix.image.repo }}
          # The backup-agent cell suffixes every tag (2.12.0-backup-agent,
          # latest-backup-agent, ...); the plain cells pass an empty suffix.
          flavor: |
            latest=false
            suffix=${{ matrix.image.suffix || '' }},onlatest=true
          tags: |
            type=semver,pattern={{version}},value=${{ needs.validate-release-ref.outputs.release_tag }},enable=${{ needs.validate-release-ref.outputs.is_semver == 'true' }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.validate-release-ref.outputs.release_tag }},enable=${{ needs.validate-release-ref.outputs.is_semver == 'true' }}
            type=semver,pattern={{major}},value=${{ needs.validate-release-ref.outputs.release_tag }},enable=${{ needs.validate-release-ref.outputs.is_semver == 'true' }}
            type=raw,value=sha-${{ needs.validate-release-ref.outputs.short_sha }}
            type=raw,value=latest,enable=${{ needs.validate-release-ref.outputs.publish_latest == 'true' }}

      - name: Create + push manifest list
        working-directory: /tmp/digests
        # The digest list comes from sentinel files dropped by the publish
        # job — one filename per arch, named after the layer digest.
        run: |
          mapfile -t digest_files < <(printf '%s\n' * | grep -E '^(amd64|arm64)-[a-f0-9]{64}$')
          if [[ ${#digest_files[@]} -ne 2 ]]; then
            printf 'expected two architecture digests, got %d\n' "${#digest_files[@]}" >&2
            exit 1
          fi

          declare -A seen=()
          declare -A seen_digest=()
          sources=()
          for file in "${digest_files[@]}"; do
            arch=${file%%-*}
            digest=${file#*-}
            if [[ -n ${seen[$arch]:-} ]]; then
              printf 'duplicate digest for %s\n' "$arch" >&2
              exit 1
            fi
            if [[ -n ${seen_digest[$digest]:-} ]]; then
              printf 'same digest received for both architectures\n' >&2
              exit 1
            fi
            seen[$arch]=1
            seen_digest[$digest]=1
            sources+=("${{ matrix.image.repo }}@sha256:$digest")
          done
          [[ -n ${seen[amd64]:-} && -n ${seen[arm64]:-} ]] || exit 1

          mapfile -t tags < <(jq -r '.tags[]' <<<"$DOCKER_METADATA_OUTPUT_JSON")
          tag_args=()
          for tag in "${tags[@]}"; do
            tag_args+=(-t "$tag")
          done
          docker buildx imagetools create "${tag_args[@]}" "${sources[@]}"

      - name: Inspect manifest
        # backup-agent publishes into the same repository as backend, with
        # every tag suffixed (`sha-<short>-backup-agent`). Inspecting the
        # unsuffixed :sha-<short> looks up the backend image — which the
        # sibling matrix cell may not have written yet — and fails "not
        # found" after a successful imagetools create, skipping the git tag.
        env:
          IMAGE_REF: ${{ matrix.image.repo }}:sha-${{ needs.validate-release-ref.outputs.short_sha }}${{ matrix.image.suffix || '' }}
        run: docker buildx imagetools inspect "$IMAGE_REF"
