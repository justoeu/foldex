name: dast

# DAST — OWASP ZAP baseline (passive, non-destructive) against a fully
# booted stack. Runs MONTHLY (the user asked for ~1×/month) plus on-demand via
# the Actions "Run workflow" button. The baseline scan spiders the SPA and runs
# passive rules only — it never sends active attack payloads, so the ephemeral
# CI database stays clean.
#
# The stack is built from source (docker compose --build) so the scan reflects
# the current main, not whatever `:latest` happens to be on Docker Hub.
on:
  schedule:
    - cron: '0 6 1 * *' # 06:00 UTC on the 1st of every month
  workflow_dispatch:

permissions:
  contents: read

jobs:
  zap-baseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Prepare environment
        # NOT `cp .env.example .env`: the template ships the RustFS secrets
        # EMPTY on purpose, and docker-compose.services.yml requires them with
        # the ${VAR:?...} form, which fails for empty as well as unset — so a
        # bare copy cannot interpolate and the object store never starts.
        # init-env.sh is what `make env` runs; its defaults are already
        # .env/.env.example.
        run: bash scripts/init-env.sh

      - name: Generate self-signed TLS pair for nginx
        # docker-compose.yml bind-mounts ./web/certs read-only; without a real
        # pair here the container entrypoint can't write its ephemeral cert into
        # the ro mount and nginx fails to start. Pre-seed a throwaway pair whose
        # SAN covers the in-network hostname `web` and `localhost`.
        run: |
          mkdir -p web/certs
          openssl req -x509 -newkey rsa:2048 -nodes \
            -keyout web/certs/key.pem -out web/certs/cert.pem \
            -days 365 -subj "/CN=web" \
            -addext "subjectAltName=DNS:web,DNS:localhost,IP:127.0.0.1"
          # OpenSSL 3 writes the key 0600 owned by the runner user (uid 1001),
          # and the web container runs as `nginx` (uid 101) against a bind mount
          # that preserves host ownership — so nginx got "Permission denied"
          # opening it and crash-looped for the entire health wait. Loosening
          # the mode is safe HERE and nowhere else: the pair is minted fresh for
          # this job, covers only the in-network hostname, and is destroyed with
          # the runner. The shipped image never sees it (web/entrypoint-certs.sh
          # generates its own), which is the invariant that keeps a private key
          # out of the published image.
          chmod 0644 web/certs/key.pem

      - name: Boot the stack
        # Pin CORS to a concrete origin so the backend's secure-defaults guard
        # (non-loopback bind + empty SHARED_SECRET + wildcard CORS refuses to
        # boot — config.validateSecureDefaults, CLAUDE.md §4) can't trip even if
        # a future .env.example reintroduces a wildcard. Shell env outranks .env
        # in compose interpolation. Keeps /api reachable for the scan.
        env:
          CORS_ORIGINS: https://localhost
        run: |
          docker network inspect foldex >/dev/null 2>&1 || docker network create foldex
          # --wait, or `make migrate-up` below can reach the container
          # before Postgres is accepting connections.
          docker compose -f docker-compose.db.yml up -d --wait
          # The object store moved out of docker-compose.yml. Without it the
          # backend boots with a nil storage client and router.go never mounts
          # /api/backup/*, so the scan would silently stop covering the routes
          # that take third-party ZIPs and serve public object keys — the last
          # place a shrinking scan surface should go unnoticed.
          docker compose -f docker-compose.services.yml up -d --wait rustfs
          docker compose -f docker-compose.services.yml up -d --wait --wait-timeout 120 rustfs-init
          # Migrations are applied deliberately in this project — nothing in
          # compose runs them, and db.CheckSchemaVersion makes the backend exit
          # 1 rather than serve queries against a schema it does not recognise.
          # Without this step the scan spent its whole budget waiting on a
          # container that had already decided not to start. Deliberately the
          # SAME command the README gives an operator, so a break in the
          # documented path fails here instead of on someone's first install.
          make migrate-up
          docker compose up -d --build

      - name: Wait for the app to be healthy
        run: |
          # 90 × 3s = 4.5 min headroom — a cold `--build` (Go + bun + Vite)
          # plus Postgres init can exceed 3 min on a loaded runner.
          for i in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:9089/healthz >/dev/null 2>&1 \
               && curl -fsSk https://127.0.0.1:9444/healthz >/dev/null 2>&1; then
              echo "stack healthy after ${i} tries"
              exit 0
            fi
            sleep 3
          done
          echo "::error::stack did not become healthy in time"
          docker compose logs --no-color --tail 200 || true
          exit 1

      - name: Assert web runs as non-root
        # Defense against a silent revert of `USER nginx` in web/Dockerfile.
        # Without this, a future commit dropping the directive ships green
        # and re-opens the "No default non-root user" scanner finding until
        # the next monthly DAST — which never checks UID. Cheap to assert
        # here because the stack is already booted for the ZAP scan.
        run: |
          uid="$(docker compose exec -T web id -u)"
          if [ "$uid" != "101" ]; then
            echo "::error::web container is running as uid $uid, expected 101 (nginx)"
            docker compose logs --no-color --tail 50 web || true
            exit 1
          fi
          echo "web container runs as non-root uid $uid"

      - name: ZAP baseline scan
        # Run ZAP on the shared `foldex` network so it reaches nginx by its
        # service name `web` (TLS on 443). ZAP accepts self-signed upstream
        # certs by default. `|| true` keeps this an informational gate
        # (CLAUDE.md §2 posture). Image digest-pinned (`:stable` is a moving
        # tag — CLAUDE.md §4). ZAP runs as the non-root `zap` user, so the
        # bind-mounted report dir must be world-writable or report generation
        # fails with AccessDeniedException — hence the dedicated chmod 0777 dir.
        run: |
          mkdir -p zap-out && chmod 0777 zap-out
          docker run --rm --network foldex \
            -v "$PWD/zap-out:/zap/wrk:rw" -t \
            ghcr.io/zaproxy/zaproxy@sha256:7c2f8afc893e4e4000be8ad3fd22013fc36e5cce59359349f5a2d45626e2ccb9 \
            zap-baseline.py -t https://web -I \
              -r zap-report.html -w zap-report.md -J zap-report.json || true

      - name: Upload ZAP reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: zap-baseline-report
          path: |
            zap-out/zap-report.html
            zap-out/zap-report.md
            zap-out/zap-report.json
          if-no-files-found: warn
          retention-days: 30

      - name: Tear down
        if: always()
        run: |
          docker compose down -v || true
          docker compose -f docker-compose.services.yml down -v || true
          docker compose -f docker-compose.db.yml down -v || true
