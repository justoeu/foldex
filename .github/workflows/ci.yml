name: ci

# Pull-request gate ONLY. Lint, unit/integration tests, coverage, and a
# no-push Docker build validation — everything that must pass before code
# lands on main. Publishing lives in release.yml (manual dispatch from main),
# so a merge or tag push never publishes; release trusts the PR gate.
on:
  pull_request:

# Least-privilege default for every job.
permissions:
  contents: read

jobs:
  # Lint every workflow under .github/workflows — syntax, shellcheck on `run:`
  # blocks, and malformed `uses:` refs — so a broken or unpinned action is
  # caught here instead of on a live run. The rhysd/actionlint image bundles
  # shellcheck; digest-pinned (`1.7.12`) per CLAUDE.md §4.
  workflows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: actionlint
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo \
            rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 \
            -color

  backend:
    runs-on: ubuntu-latest
    steps:
      # Third-party actions pinned to full SHA — major-version tags are
      # mutable and a compromised upstream could swap them silently. Comments
      # carry the original tag so Dependabot can update on a release.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.6'
          cache: true
          cache-dependency-path: backend/go.sum
      - name: require live Chrome
        run: |
          chrome_path="$(command -v google-chrome || true)"
          if [[ -z "$chrome_path" ]] || ! test -x "$chrome_path"; then
            echo "::error::GitHub Ubuntu runner must provide an executable google-chrome" >&2
            exit 1
          fi
          "$chrome_path" --version
          printf 'CHROME_PATH=%s\n' "$chrome_path" >> "$GITHUB_ENV"
      - name: gofmt
        working-directory: backend
        run: make fmt-check
      - name: vet
        working-directory: backend
        run: go vet ./...
      - name: build the tagged-out generator
        working-directory: backend
        # `previewgen` is a build tag nothing else in CI compiles, so the mail
        # preview generator would rot silently on the next constructor signature
        # change and only be noticed by whoever next tried to look at a template.
        # A build costs seconds and never executes it (it also hard-skips
        # without PREVIEW_OUT).
        run: go vet -tags previewgen ./internal/mailer/
      - name: unit + integration tests (with coverage)
        working-directory: backend
        # Tests are the hard gate — broken tests block CI. The coverage
        # instrumentation rides along (`make coverage-run` = same `go test`
        # invocation as `test-integration` plus `-covermode/-coverpkg/
        # -coverprofile`). Running tests TWICE (once bare, once for
        # coverage) used to double the integration-suite cost — each
        # testcontainers spin-up is ~3-5s × ~50 cases.
        run: make coverage-run
      - name: coverage gate (85% minimum)
        working-directory: backend
        # Reads coverage.out left behind by the previous step — does NOT
        # re-run any tests. Falling below the project threshold blocks the
        # job (see CLAUDE.md §2).
        run: make coverage-check
      - name: coverage-check shell harness
        # Locks the missing-file + threshold-pass + threshold-fail branches
        # of `make coverage-check`. Cheap (re-uses the cssvalid package
        # already exercised by the previous step) so it never inflates the
        # backend job materially.
        run: bash backend/scripts/test-coverage-check.sh
      - name: govulncheck (informational)
        # Pre-built action avoids `go run` recompiling govulncheck from
        # source on every CI run (was ~30-45s per job). Same informational
        # contract as before — finds CVEs but never blocks merge.
        uses: golang/govulncheck-action@032d45514ae346b1db93c04b0c90b841c370344f # v1.1.0
        with:
          go-version-input: '1.26.6'
          work-dir: backend
          check-latest: true
        continue-on-error: true

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          # Match CLAUDE.md §1 — Docker, dev, and CI all share one resolver.
          bun-version: '1.3'
      - working-directory: web
        run: bun install --frozen-lockfile
      - name: type-check
        working-directory: web
        run: bun run typecheck
      - name: extension tests
        working-directory: extension
        run: bun run test
      - name: tests + coverage gate
        working-directory: web
        # Vitest runs the suite once under v8 and enforces the statement,
        # line, function, and branch thresholds from vitest.config.ts.
        run: bun run coverage
      - name: release.sh awk regression
        # Locks the "first-match-only" invariant of update_version() in
        # scripts/release.sh. Without it, a future sed/awk swap could
        # silently rewrite nested "version": "x.y.z" fields (e.g. inside
        # a dependencies block of a lockfile-shaped file) and corrupt
        # the release commit.
        run: bash scripts/test-release-awk.sh
      - name: release ref security gate
        run: bash scripts/test-release-gate.sh
      - name: local credential generation contract
        run: bash scripts/test-init-env.sh
      - name: CI coverage gate contract
        run: bash scripts/test-ci-coverage-gates.sh
      - name: local Bash approval contract
        run: bash scripts/test-claude-bash-permissions.sh
      - name: nginx access-log credential redaction
        run: bash scripts/test-nginx-access-log.sh
      - name: the object store bootstrap is judged by its exit code
        # `up -d --wait` waits for running|healthy, so it reports failure for a
        # one-shot that finished its job. Driven against a fixture: the real
        # compose file names its volumes globally, so no run of it is isolated.
        run: bash scripts/test-storage-up.sh
      - name: the bundled Postgres actually starts
        # docker-compose.db.yml pinned postgres:18 from the initial commit while
        # mounting the volume at the pre-18 path, so `make db-up` exited 1 on
        # every clean install for three months. Only the image can answer this,
        # and only at runtime — so the guard boots the real file.
        run: bash scripts/test-db-compose-boots.sh
      - name: make migrate-up mounts the migrations directory
        # `make -C` does not update PWD, so the recipe's $(PWD) resolved to a
        # directory that does not exist and Docker created it empty — the
        # documented quickstart command applied nothing and said "no change".
        run: bash scripts/test-make-migrate-path.sh
      - name: nginx security headers survive on every response
        # Boots the real config and makes the requests. Reading the file is not
        # enough: nginx drops every inherited add_header the moment a location
        # declares one of its own, and that had already shipped — the SPA's own
        # document went out with none of the six while /assets/*.js carried all
        # of them.
        run: bash scripts/test-nginx-headers.sh
      - name: bun audit (informational)
        working-directory: web
        # CVE scan for npm packages. Same informational-only contract as
        # govulncheck above. `--audit-level=high` so noisy LOW/MEDIUM
        # advisories don't bury the signal.
        run: bun audit --audit-level=high
        continue-on-error: true

  # ────────────────────────────────────────────────────────────────────────
  # Docker build validation — PR-only, NEVER pushes. Confirms both images
  # still build cleanly across both architectures before the change can land
  # on main. The actual push lives in release.yml; gating it here means a
  # broken Dockerfile fails the PR instead of failing the release.
  #
  # Build topology mirrors release.yml: 2 images × 2 architectures = 4
  # runners in parallel, each building a single-arch image on a native
  # runner (no QEMU emulation).
  build-validation:
    needs: [backend, frontend]
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        image:
          # No `repo:` here — this job never pushes, so the image name is
          # unused. release.yml's publish matrix keeps it. Mirror that matrix
          # when editing platforms/contexts so the gate and the release build
          # the same images.
          - name: backend
            context: ./backend
          - name: web
            # web/Dockerfile no longer COPYs certs into the image — the
            # entrypoint generates an ephemeral self-signed pair at
            # container start (or the operator mounts their own pair as a
            # volume). Keeps private keys OUT of the published image.
            context: ./web
        platform:
          - tag: amd64
            id: linux/amd64
            runner: ubuntu-latest
          - tag: arm64
            id: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.platform.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Build (no push)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ${{ matrix.image.context }}
          file: ${{ matrix.image.context }}/Dockerfile
          platforms: ${{ matrix.platform.id }}
          push: false
          # Same scope key as release.yml, but note GitHub Actions cache is
          # branch-scoped: a PR-branch cache is NOT readable from the default
          # branch, so this mainly speeds up RE-RUNS of the same PR — it does
          # not warm the release build on main. Scope by image+arch so an amd64
          # layer never satisfies an arm64 build.
          cache-from: type=gha,scope=foldex-${{ matrix.image.name }}-${{ matrix.platform.tag }}
          cache-to: type=gha,scope=foldex-${{ matrix.image.name }}-${{ matrix.platform.tag }},mode=max
