# foldex/web — main nginx.conf override.
#
# The base nginx:alpine image ships `user nginx;` + `pid /run/nginx.pid;` in
# its main config. Both break when the container runs as the non-root `nginx`
# user (the Dockerfile sets `USER nginx`):
#   - `user nginx;` is meaningless when the master process is already
#     non-root, and nginx emits a startup warning that pollutes logs.
#   - `/run/nginx.pid` is a root-owned path; the nginx user can't create it.
#
# This file is COPY'd to /etc/nginx/nginx.conf, replacing the base. We keep
# everything else (mime.types include, log format, default sendfile/keepalive)
# identical to the upstream defaults so we don't drift from the base image's
# tuning.

worker_processes  auto;

error_log  /var/log/nginx/error.log notice;
# /tmp is world-writable in the base image (mode 1777) — the nginx user
# can create the PID file here without a chown.
pid        /tmp/nginx.pid;


events {
    worker_connections  1024;
}


http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Query strings and referrers can carry third-party OAuth credentials. Log
    # only the normalized path so access logs never become a bearer-token store.
    log_format  main  '$remote_addr - $remote_user [$time_local] "$request_method $uri $server_protocol" '
                      '$status $body_bytes_sent '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    # Cache-Control as DATA, so that no `location` block has to declare an
    # `add_header` of its own.
    #
    # That is not a style preference — it is the fix for a real defect. nginx's
    # add_header inherits from the enclosing level ONLY while the inner level
    # declares none of its own; the moment a location adds one header, it
    # discards every inherited one. Three locations (`= /index.html`, `= /sw.js`,
    # `= /registerSW.js`) each added a Cache-Control, and so served the SPA with
    # NONE of the six security headers. Measured against the running stack:
    # `/`, `/index.html` and `/sw.js` returned 0 of 6, while `/assets/*.js` and
    # the webmanifest returned 6 of 6 — exactly backwards, since CSP,
    # X-Frame-Options and frame-ancestors govern the DOCUMENT and do almost
    # nothing on a script file.
    #
    # `/` reaches this map as `/index.html`: try_files performs an internal
    # redirect and $uri is rewritten before the map is evaluated. An empty value
    # emits no header at all, so revisioned assets keep their default caching.
    map $uri $fx_cache_control {
        default        "";
        # The service worker must never be cached, or updates never reach a
        # client. index.html likewise: it names the revisioned chunks, and a
        # stale copy points at chunks that no longer exist on disk.
        /index.html    "no-cache, no-store, must-revalidate";
        /sw.js         "no-cache, no-store, must-revalidate";
        /registerSW.js "no-cache, no-store, must-revalidate";
    }

    sendfile        on;
    #tcp_nopush     on;

    keepalive_timeout  65;

    #gzip  on;

    include /etc/nginx/conf.d/*.conf;
}
