# foldex/web — main nginx.conf override.
#
# The base nginx:alpine image ships `user nginx;` + `pid /run/nginx.pid;` in
# its main config. Both break when the container runs as the non-root `nginx`
# user (the Dockerfile sets `USER nginx`):
#   - `user nginx;` is meaningless when the master process is already
#     non-root, and nginx emits a startup warning that pollutes logs.
#   - `/run/nginx.pid` is a root-owned path; the nginx user can't create it.
#
# This file is COPY'd to /etc/nginx/nginx.conf, replacing the base. We keep
# everything else (mime.types include, log format, default sendfile/keepalive)
# identical to the upstream defaults so we don't drift from the base image's
# tuning.

worker_processes  auto;

error_log  /var/log/nginx/error.log notice;
# /tmp is world-writable in the base image (mode 1777) — the nginx user
# can create the PID file here without a chown.
pid        /tmp/nginx.pid;


events {
    worker_connections  1024;
}


http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Query strings and referrers can carry third-party OAuth credentials. Log
    # only the normalized path so access logs never become a bearer-token store.
    log_format  main  '$remote_addr - $remote_user [$time_local] "$request_method $uri $server_protocol" '
                      '$status $body_bytes_sent '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    # Cache-Control as DATA, so that no `location` block has to declare an
    # `add_header` of its own.
    #
    # That is not a style preference — it is the fix for a real defect. nginx's
    # add_header inherits from the enclosing level ONLY while the inner level
    # declares none of its own; the moment a location adds one header, it
    # discards every inherited one. Three locations (`= /index.html`, `= /sw.js`,
    # `= /registerSW.js`) each added a Cache-Control, and so served the SPA with
    # NONE of the six security headers. Measured against the running stack:
    # `/`, `/index.html` and `/sw.js` returned 0 of 6, while `/assets/*.js` and
    # the webmanifest returned 6 of 6 — exactly backwards, since CSP,
    # X-Frame-Options and frame-ancestors govern the DOCUMENT and do almost
    # nothing on a script file.
    #
    # `/` reaches this map as `/index.html`: try_files performs an internal
    # redirect and $uri is rewritten before the map is evaluated. An empty value
    # emits no header at all, so revisioned assets keep their default caching.
    map $uri $fx_cache_control {
        default        "";
        # The service worker must never be cached, or updates never reach a
        # client. index.html likewise: it names the revisioned chunks, and a
        # stale copy points at chunks that no longer exist on disk.
        /index.html    "no-cache, no-store, must-revalidate";
        /sw.js         "no-cache, no-store, must-revalidate";
        /registerSW.js "no-cache, no-store, must-revalidate";
    }

    # ── Rate limiting at the edge (docs/SDD-ABUSE-DEFENSE.md §4.4) ──────────
    #
    # This is the only layer that runs BEFORE the backend allocates anything:
    # before bcrypt, before a pool connection, before the login path's
    # constant-time floor. It is also the dumbest layer, and that is on
    # purpose — it knows an address and a path, nothing else, so it may only
    # decide "too fast", never "who".
    #
    # Three zones instead of one blanket rule, because the surfaces have
    # genuinely different shapes:
    #
    #   fx_login   the endpoints that TEST a credential. 2r/s is invisible to a
    #              human — nobody types two passwords a second — and collapses a
    #              script from hundreds per second to two. This is the zone that
    #              does the work.
    #   fx_auth    the rest of /api/auth/*. The SPA legitimately bursts here:
    #              /api/auth/me and /api/auth/refresh fire on load, on focus and
    #              on every 401 retry, and several tabs multiply that. A tight
    #              cap here would throttle the application, not the attacker.
    #   fx_public  /go/ and /n/ — shared links. A popular post produces a real
    #              burst from many distinct addresses, so the cap is per
    #              address and generous; what it removes is one address in a
    #              loop, which is the write amplifier on click_log.
    #
    # /api/* as a whole is deliberately NOT limited here. The authenticated API
    # has irregular but legitimate bursts (import, backup restore, pasting
    # fifty links) and the backend has the context to tell a user from a loop —
    # a ceiling at the edge would produce false positives where the layer below
    # can decide properly.
    #
    # CAVEAT, and it is the same defect as an empty TRUSTED_PROXY_IPS one layer
    # up: $binary_remote_addr is the PEER. With another proxy in front of this
    # nginx, every zone below collapses into one bucket for the whole internet,
    # and the instance rate-limits itself. An installation in that shape must
    # enable ngx_http_realip_module here (set_real_ip_from <that proxy>;
    # real_ip_header X-Forwarded-For;) — it is not enabled by default because
    # guessing whom to trust is exactly the decision the Go side refuses to
    # make on its own.
    limit_req_zone $binary_remote_addr zone=fx_login:10m  rate=2r/s;
    limit_req_zone $binary_remote_addr zone=fx_auth:10m   rate=30r/s;
    limit_req_zone $binary_remote_addr zone=fx_public:10m rate=20r/s;

    # 429, not nginx's default 503. A 503 says "the server is broken" and
    # invites a retry loop; 429 says "you, slow down" and is what the SPA's
    # error mapping and any well-behaved client already understand.
    limit_req_status 429;
    limit_req_log_level warn;

    sendfile        on;
    #tcp_nopush     on;

    keepalive_timeout  65;

    #gzip  on;

    include /etc/nginx/conf.d/*.conf;
}
