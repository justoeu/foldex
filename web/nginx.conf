# Redirect HTTP → HTTPS.
# Host is baked at container start from WEB_PUBLIC_HOST (default localhost)
# by entrypoint-certs.sh — never from the request Host header (semgrep
# request-host-used / host-header injection).
server {
  listen 8080;
  server_name _;
  return 301 https://__WEB_PUBLIC_HOST__$request_uri;
}

server {
  listen 8443 ssl;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # A browser given a bare `host:9444` assumes http:// and speaks plaintext to
  # this TLS port; nginx's default answer is a dead-end 400 ("The plain HTTP
  # request was sent to HTTPS port"). 497 is nginx's internal code for exactly
  # that case — turn it into the same canonical redirect the :8080 listener
  # gives. Baked host, never the request Host header (same host-header-
  # injection rule as the redirect above).
  error_page 497 =301 https://__WEB_PUBLIC_HOST__$request_uri;

  # Defense-in-depth security headers. The single-user threat model doesn't
  # require these, but any planted XSS in the SPA (e.g. via a future render
  # bug) becomes far less useful when fetches and frame embeds are bounded.
  # `always` makes nginx emit them on error responses too (default would
  # skip 4xx/5xx).
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header X-Frame-Options DENY always;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy "no-referrer" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
  # CSP: SPA serves only its own bundle + Vite-emitted styles. The frontend
  # talks to /api on the same origin (proxied below) and pulls images from
  # both the same origin (proxied screenshots/images) and arbitrary https
  # (favicons / og:image of saved links). data: is allowed for inline image
  # fallbacks. `unsafe-inline` for style-src is required by emotion's
  # runtime styles — script-src stays strict (no 'unsafe-inline'/'unsafe-eval').
  # Two allowances exist because the SPA genuinely needs them, and they were
  # found the moment this policy started applying at all — before this file
  # stopped dropping its own headers, the CSP had never reached the document.
  #
  #   fonts.googleapis.com / fonts.gstatic.com — foldex.css opens with an
  #   @import of the three brand faces, and Vite hoists it to the first byte of
  #   the built stylesheet. Two gates, not one: style-src fetches the CSS,
  #   font-src fetches the woff2 behind it. Without both, --fx-display, --fx-ui
  #   and --fx-mono all fall back to system faces at once.
  #
  #   blob: in img-src — the link dialog previews a chosen file through
  #   URL.createObjectURL (web/src/hooks/useLinkDialogImage.ts). 'self' does not
  #   cover blob:, and the user would pick an image and see nothing.
  #
  # Self-hosting the fonts would remove the first allowance and the third-party
  # request with it; that is a deliberate follow-up, not an oversight.
  #
  # script-src stays strict — no 'unsafe-inline', no 'unsafe-eval'. That is the
  # one property CLAUDE.md §4 writes down, and scripts/test-nginx-headers.sh now
  # asserts it as a NEGATIVE check, because a policy can be present and useless.
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob: https:; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self'; worker-src 'self'; manifest-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
  # Driven by the $fx_cache_control map in nginx.main.conf, and it MUST stay
  # here rather than inside the locations it applies to.
  #
  # **DO NOT add an `add_header` to any location block in this file.** nginx
  # inherits add_header from the enclosing level only while the inner level
  # declares none of its own; one header in a location silently drops all six
  # above it. That is not hypothetical — it is what this map replaced, and the
  # SPA shipped with no CSP because of it. scripts/test-nginx-headers.sh boots
  # this exact config and fails if any response loses them.
  add_header Cache-Control $fx_cache_control always;

  # PWA manifest needs the canonical MIME so Chrome/Safari install it.
  # Use a location override instead of a server-level `types {}` block
  # because the latter REPLACES the default /etc/nginx/mime.types, which
  # would silently break every other extension (e.g. .js served as
  # application/octet-stream).
  location ~ \.webmanifest$ {
    default_type application/manifest+json;
  }

  ssl_certificate     /etc/nginx/certs/cert.pem;
  ssl_certificate_key /etc/nginx/certs/key.pem;
  ssl_protocols       TLSv1.2 TLSv1.3;
  ssl_ciphers         HIGH:!aNULL:!MD5;

  # Backup restore needs to accept large multipart uploads. The backend caps
  # at 2 GiB; we keep the proxy lid at 512 MiB so an honest mistake here
  # surfaces as a clear error instead of a silent OOM on the backend.
  client_max_body_size 512m;

  # SPA fallback
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Image upload — `proxy_request_buffering off` (set on /api/ below for
  # backup streams) makes nginx forward bytes as they arrive. When the
  # backend's MaxBytesReader trips on an oversized image, it drops the
  # connection mid-stream and nginx returns 502 instead of the backend's
  # clean 413. Carving the image endpoint out into its own location so
  # the request is buffered and the cap is enforced by nginx before the
  # request ever reaches the backend — the user gets a deterministic
  # 413 instead of a 502 race.
  #
  # Cap is 22 MiB (slightly above the backend's 20 MiB ceiling) so the
  # backend's typed 413 (with the JSON envelope) wins for any payload
  # between 20 and 22 MiB; only frankly oversized requests get nginx's
  # plain-text 413.
  location ~ ^/api/links/[0-9]+/image$ {
    proxy_pass http://backend:9089;
    # $proxy_host = upstream from proxy_pass (not attacker Host header).
    proxy_set_header Host $proxy_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    client_max_body_size 22m;
    # default proxy_request_buffering is `on` — explicit for documentation.
    proxy_request_buffering on;
  }

  # Proxy API + redirect to backend
  location /api/ {
    proxy_pass http://backend:9089;
    proxy_set_header Host $proxy_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    # Streaming + generous timeouts for backup endpoints. Defaults (60s) cut
    # the connection mid-upload on slower networks for large zips.
    proxy_request_buffering off;
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;
  }
  location /go/ {
    proxy_pass http://backend:9089;
    proxy_set_header Host $proxy_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
  }
  # Public note render (GET /n/{id-or-slug}) — same shape as /go/ above.
  # Without this block the SPA fallback (`location /`) would catch it and
  # serve index.html instead of the backend's rendered note page.
  location /n/ {
    proxy_pass http://backend:9089;
    proxy_set_header Host $proxy_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
  }
  location /healthz {
    proxy_pass http://backend:9089;
  }
}
