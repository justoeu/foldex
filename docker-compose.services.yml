services:
  db:
    image: postgres:18.4-alpine
    container_name: foldex-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-foldex}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-foldex}
      POSTGRES_DB: ${POSTGRES_DB:-foldex}
    # Postgres is reached through the shared `foldex` network — by service
    # name `db` (alias) or by container name `foldex-db`. We do NOT publish a
    # host port by default to avoid conflicts with other local Postgres
    # instances. Uncomment to expose for GUI clients.
    # ports:
    #   - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-foldex} -d ${POSTGRES_DB:-foldex}"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      foldex:
        aliases: [db]

  # S3-compatible object store (screenshots, note images, backup files).
  # Pin matches CLAUDE.md §1 — bump intentionally, not via a moving channel.
  #
  # Root credentials (RUSTFS_ROOT_*) are ONLY for the server process + the
  # one-shot rustfs-init bootstrap. The Foldex backend never sees them —
  # it authenticates as the app user provisioned by rustfs-init.
  rustfs:
    # RustFS has no GA release yet. Pin its newest non-preview release candidate
    # by digest instead of following the mutable latest/rc/main channels.
    image: rustfs/rustfs:1.0.0-rc.2@sha256:7d6d361c49c08d427250fb59aae5d78df83d644c3405d9ccf4b21cda0b0692d0
    container_name: foldex-rustfs
    restart: unless-stopped
    security_opt:
      - "no-new-privileges:true"
    environment:
      RUSTFS_ACCESS_KEY: ${RUSTFS_ROOT_ACCESS_KEY:-rustfsadmin}
      RUSTFS_SECRET_KEY: ${RUSTFS_ROOT_SECRET_KEY:?run make env to generate RustFS credentials}
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ADDRESS: 0.0.0.0:9001
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_CONSOLE_CORS_ALLOWED_ORIGINS: "*"
      # Single-disk self-host (personal box). Multi-disk EC needs 4+ volumes.
      RUSTFS_VOLUMES: /data
      RUSTFS_UNSAFE_BYPASS_DISK_CHECK: ${RUSTFS_UNSAFE_BYPASS_DISK_CHECK:-true}
      RUSTFS_OBS_LOGGER_LEVEL: info
    ports:
      # Host ports are configurable because 9000/9001 are the S3 defaults that
      # every MinIO-shaped service on a developer machine also claims. The
      # CONTAINER side stays fixed: the backend reaches the store as
      # `rustfs:9000` over the compose network, so remapping the host side is
      # purely about who gets to browse it from the host.
      - "127.0.0.1:${RUSTFS_HOST_PORT:-9000}:9000"
      - "127.0.0.1:${RUSTFS_CONSOLE_HOST_PORT:-9001}:9001"
    volumes:
      - rustfs_data:/data
    healthcheck:
      test:
        [
          "CMD",
          "sh", "-ec",
          "curl -fsS http://127.0.0.1:9000/health",
        ]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 20s
    networks:
      foldex:
        aliases: [rustfs]

  # One-shot: create app IAM user + bucket-scoped policy. Backend depends on
  # this completing successfully (see docker-compose.yml).
  rustfs-init:
    # Build the one-shot locally: this container receives both root and app
    # secrets, so it must never resolve through a mutable remote Foldex tag.
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: rustfs-bootstrap
    container_name: foldex-rustfs-init
    restart: "no"
    depends_on:
      rustfs:
        condition: service_healthy
    environment:
      RUSTFS_ENDPOINT: rustfs:9000
      RUSTFS_USE_SSL: "false"
      RUSTFS_ROOT_ACCESS_KEY: ${RUSTFS_ROOT_ACCESS_KEY:-rustfsadmin}
      RUSTFS_ROOT_SECRET_KEY: ${RUSTFS_ROOT_SECRET_KEY:?run make env to generate RustFS credentials}
      # App principal the backend will use.
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:-foldex}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:?run make env to generate RustFS credentials}
      RUSTFS_BUCKET: ${RUSTFS_BUCKET:-foldex-screenshots}
      RUSTFS_APP_POLICY: ${RUSTFS_APP_POLICY:-foldex-app}
      RUSTFS_ALLOW_INSECURE_DEV_CREDENTIALS: ${RUSTFS_ALLOW_INSECURE_DEV_CREDENTIALS:-0}
    networks:
      foldex:
        aliases: [rustfs-init]

# Same convention as docker-compose.db.yml — the network is owned by the
# Makefile's `make network` target so all 3 compose projects can attach
# cleanly without label-mismatch errors.
networks:
  foldex:
    name: foldex
    external: true

volumes:
  pgdata:
    name: foldex_pgdata
  rustfs_data:
    name: foldex_rustfs_data
